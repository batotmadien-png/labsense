<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabSense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">LabSense</div>
  <select id="lang" aria-label="Language"></select>
</header>

<main>
  <section class="hero">
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
    <div class="gauge" aria-hidden="true"><i class="lo"></i><i class="ok"></i><i class="hi"></i><b></b></div>
  </section>

  <section class="panel">
    <label class="drop" id="drop" for="file">
      <input type="file" id="file" accept="image/*" hidden>
      <span data-i18n="drop"></span>
    </label>
    <img id="preview" alt="" hidden>
    <button id="go" disabled data-i18n="analyze"></button>
    <p class="note" data-i18n="privacy"></p>
  </section>

  <section id="status" role="status" aria-live="polite"></section>

  <section id="out" hidden>
    <div id="urgent" class="urgent" hidden></div>
    <button id="listen" class="ghost" data-i18n="listen"></button>
    <p id="voiceNote" class="note" hidden></p>
    <h2 data-i18n="summary"></h2>
    <p id="summary" class="summary"></p>
    <h2 data-i18n="results"></h2>
    <ul id="tests" class="tests"></ul>
    <h2 data-i18n="questions"></h2>
    <ul id="qs" class="qs"></ul>
    <button id="again" class="ghost" data-i18n="again"></button>
  </section>

  <p class="disclaimer" data-i18n="disclaimer"></p>
</main>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
