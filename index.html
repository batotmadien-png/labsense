<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LabSense - فهم نتائج التحاليل الطبية بالذكاء الاصطناعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Header Section -->
<header>
  <div class="brand">
    <div class="brand-logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 2v7.31a2 2 0 0 1-.41 1.21L4.2 17.15A4 4 0 0 0 7.37 23h9.26a4 4 0 0 0 3.17-5.85l-5.39-6.63A2 2 0 0 1 14 9.31V2"/>
        <path d="M8.5 2h7"/>
        <path d="M7 16h10"/>
      </svg>
    </div>
    <span class="brand-text">LabSense</span>
    <span class="brand-badge">AI</span>
  </div>
  <div class="hbar">
    <button id="histBtn" class="hbtn" data-i18n="history"></button>
    <div class="lang-wrap">
      <select id="lang" aria-label="Language"></select>
    </div>
  </div>
</header>
<main>
  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-pill">
      <span class="hero-pill-dot"></span>
      <span>تحليل ذكي فوري للتقارير الطبية</span>
    </div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
    
    <div class="gauge-container" aria-hidden="true">
      <div class="gauge">
        <i class="lo" title="Low"></i>
        <i class="ok" title="Normal"></i>
        <i class="hi" title="High"></i>
        <b></b>
      </div>
      <div class="gauge-labels">
        <span class="gl-lo">منخفض (Low)</span>
        <span class="gl-ok">طبيعي (Normal)</span>
        <span class="gl-hi">مرتفع (High)</span>
      </div>
    </div>
  </section>
  <!-- Upload & Action Panel -->
  <section class="panel">
    <label class="drop" id="drop" for="file">
      <input type="file" id="file" accept="image/*" hidden>
      <div class="drop-illustration" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
          <path d="M12 12v9"/>
          <path d="m16 16-4-4-4 4"/>
        </svg>
      </div>
      <span class="drop-main-text" data-i18n="drop"></span>
      <span class="drop-sub-text">التقط صورة بكاميرا الهاتف أو ارفع ملف صورة (PNG, JPG, WEBP)</span>
    </label>
    <div class="preview-wrapper" id="previewWrap">
      <img id="preview" alt="معاينة التحليل" hidden>
    </div>
    <div class="panel-options">
      <label class="chk">
        <input type="checkbox" id="simple">
        <span class="chk-custom" aria-hidden="true"></span>
        <span class="chk-label" data-i18n="simple"></span>
      </label>
    </div>
    <button id="go" disabled data-i18n="analyze"></button>
    
    <div class="privacy-note">
      <svg class="privacy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <p class="note" data-i18n="privacy"></p>
    </div>
  </section>
  <!-- History Modal / Section -->
  <section id="history" hidden>
    <div class="section-header">
      <h2 data-i18n="history"></h2>
      <button id="histClose" class="ghost close-btn" data-i18n="close"></button>
    </div>
    <p id="histEmpty" class="note hist-empty-msg" data-i18n="historyEmpty" hidden></p>
    <div id="histBody">
      <div class="hist-field">
        <label class="note" for="histTest" data-i18n="pickTest"></label>
        <select id="histTest" class="wide"></select>
      </div>
      <div id="chart"></div>
      <p id="histNote" class="note"></p>
      <h3 data-i18n="reportsLabel"></h3>
      <div id="reports"></div>
      <button id="clearAll" class="ghost danger-btn" data-i18n="clearAll"></button>
    </div>
  </section>
  <!-- Status / Loading Area -->
  <section id="status" role="status" aria-live="polite"></section>
  <!-- Output / Analysis Results -->
  <section id="out" hidden>
    <div id="urgent" class="urgent" hidden></div>
    
    <div class="out-actions-bar">
      <button id="listen" class="ghost voice-btn" data-i18n="listen"></button>
      <p id="voiceNote" class="note voice-note" hidden></p>
    </div>
    <div class="summary-card">
      <div class="card-title-group">
        <span class="icon-wrap" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </span>
        <h2 data-i18n="summary"></h2>
      </div>
      <p id="summary" class="summary"></p>
    </div>
    <div class="results-card">
      <div class="card-title-group">
        <span class="icon-wrap" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </span>
        <h2 data-i18n="results"></h2>
      </div>
      <ul id="tests" class="tests"></ul>
    </div>
    <div class="questions-card">
      <div class="card-title-group">
        <span class="icon-wrap" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </span>
        <h2 data-i18n="questions"></h2>
      </div>
      <ul id="qs" class="qs"></ul>
    </div>
    <p id="savedNote" class="note save-pill" data-i18n="saved" hidden></p>
    
    <div class="out-bottom-buttons">
      <button id="simpler" class="ghost" data-i18n="simpler"></button>
      <button id="again" class="ghost" data-i18n="again"></button>
    </div>
  </section>
  <!-- Medical Disclaimer -->
  <footer class="disclaimer-footer">
    <div class="disclaimer-icon" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <p class="disclaimer" data-i18n="disclaimer"></p>
  </footer>
</main>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
